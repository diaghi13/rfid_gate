<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RFID Gate</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <i class="fas fa-door-open login-icon"></i>
          <h1>RFID Gate System</h1>
          <p>Accedi per gestire il sistema</p>
        </div>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="username"> <i class="fas fa-user"></i> Username </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              placeholder="Inserisci username"
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password"> <i class="fas fa-lock"></i> Password </label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Inserisci password"
              autocomplete="current-password"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-login"
            id="login-btn"
          >
            <i class="fas fa-sign-in-alt"></i> Accedi
          </button>
        </form>

        <div class="login-footer">
          <div class="demo-credentials">
            <h4><i class="fas fa-info-circle"></i> Credenziali Demo</h4>
            <p><strong>Username:</strong> admin</p>
            <p><strong>Password:</strong> admin123</p>
          </div>
        </div>
      </div>

      <div class="system-info">
        <div class="info-card">
          <h3><i class="fas fa-shield-alt"></i> Sistema Sicuro</h3>
          <p>Accesso protetto con autenticazione JWT</p>
        </div>
        <div class="info-card">
          <h3><i class="fas fa-mobile-alt"></i> Responsive</h3>
          <p>Interfaccia ottimizzata per tutti i dispositivi</p>
        </div>
        <div class="info-card">
          <h3><i class="fas fa-bolt"></i> Real-time</h3>
          <p>Aggiornamenti in tempo reale con WebSocket</p>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script src="/static/app.js"></script>
    <script>
      // Login form handler
      document
        .getElementById("login-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const loginBtn = document.getElementById("login-btn");

          // Show loading
          loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Accesso...';
          loginBtn.disabled = true;

          try {
            // Demo mode - simulate login without backend
            if (username === "admin" && password === "admin123") {
              // Save demo token and user
              localStorage.setItem("access_token", "demo-token-12345");
              localStorage.setItem(
                "user",
                JSON.stringify({
                  username: "admin",
                  role: "administrator",
                  name: "Demo Admin",
                })
              );

              showToast(
                "Accesso effettuato con successo! (Demo Mode)",
                "success"
              );

              // Redirect to dashboard
              setTimeout(() => {
                window.location.href = "/templates/dashboard.html";
              }, 1000);
            } else {
              showToast(
                "Credenziali non valide. Usa: admin / admin123",
                "error"
              );
            }
          } catch (error) {
            showToast("Errore di connessione", "error");
            console.error("Login error:", error);
          } finally {
            // Restore button
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Accedi';
            loginBtn.disabled = false;
          }
        });

      // Check if already logged in (demo mode)
      document.addEventListener("DOMContentLoaded", function () {
        const token = localStorage.getItem("access_token");
        if (token === "demo-token-12345") {
          // Already logged in, redirect to dashboard
          window.location.href = "/templates/dashboard.html";
        }
      });
    </script>
  </body>
</html>
